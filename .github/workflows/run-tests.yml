name: Run Tests

on:
 workflow_dispatch:
 push:
   # Source release snapshots use VPM checks; this matrix needs Unity license secrets.
   branches-ignore:
     - 'release/**'
   paths-ignore:
     - '.docfx/**'
     - '*.md'
     - '.gitignore'
 pull_request:
   paths-ignore:
     - '.docfx/**'
     - '*.md'
     - '.gitignore'

env:
 PROJECT_PATH: .ci-unity
 PACKAGE_PATH: .ci-unity/Packages/io.github.drcain1.meshia.mesh-simplification
 UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
 UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
 UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
 UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

jobs:
 license:
   name: Check Unity license configuration
   runs-on: ubuntu-latest
   permissions:
     contents: read
   outputs:
     configured: ${{ steps.license.outputs.configured }}
   steps:
     - id: license
       run: |
         if [[ -n "$UNITY_LICENSE" || ( -n "$UNITY_SERIAL" && -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" ) ]]; then
           echo 'configured=true' >> "$GITHUB_OUTPUT"
         else
           echo 'configured=false' >> "$GITHUB_OUTPUT"
           echo 'Unity tests skipped: no Unity license credentials are configured for this run. This is not a passing Unity test result. Package validation and release artifacts run separately.' >> "$GITHUB_STEP_SUMMARY"
         fi

 test:
   needs: license
   if: needs.license.outputs.configured == 'true'
   name: Test in ${{ matrix.testMode }} on ${{ matrix.unityVersion }}${{ matrix.vpmPackages[0] != null && ' with VPM packages ' || '' }}${{ join(matrix.vpmPackages, ', ') }}
   permissions:
     contents: read
     checks: write
   runs-on: ubuntu-latest
   strategy:
     fail-fast: false
     matrix:
       unityVersion:
         - 6000.0.51f1
         - 6000.1.8f1
       testMode:
         - playmode
         - standalone
       vpmPackages:
         - []
       include:
         - unityVersion: 2022.3.22f1
           testMode: editmode
           vpmPackages:
            - com.vrchat.base
            - nadena.dev.ndmf
         - unityVersion: 2022.3.22f1
           testMode: editmode
           vpmPackages:
            - nadena.dev.modular-avatar
            - com.vrchat.base

   steps:
     # The test runner expects the workspace itself to be a Git checkout.
     - name: Checkout repository
       uses: actions/checkout@v4
       with:
         lfs: true

     - name: Create package testing project
       uses: RamType0/create-unity-project@v0.2.0
       with:
         projectPath: ${{ env.PROJECT_PATH }}
         unityVersion: ${{ matrix.unityVersion }}
         # com.vrchat.base is missing dependency to com.unity.modules.video
         # com.unity.xr.oculus (Referenced by com.vrchat.base) is missing dependency to com.unity.modules.androidjni
         # Until https://github.com/bdunderscore/ndmf/pull/655 is merged into stable version, we need to define com.unity.modules.animation dependency explicitly.
         manifest: |
            {
              "dependencies": {
                "com.unity.modules.androidjni": "1.0.0",
                "com.unity.modules.animation": "1.0.0",
                "com.unity.modules.video": "1.0.0",
                "com.unity.test-framework": "1.4.6",
                "com.unity.test-framework.performance": "3.0.3",
                "com.unity.testtools.codecoverage": "1.2.6"
              },
              "testables": ["io.github.drcain1.meshia.mesh-simplification"]
            }

     - name: Copy tracked package files into the test project
       run: |
         mkdir -p "$PACKAGE_PATH"
         git ls-files -z | tar --null -T - -cf - | tar -xf - -C "$PACKAGE_PATH"

     - name: Setup vrc-get
       uses: anatawa12/sh-actions/setup-vrc-get@master

     - name: Add localization dependency VPM repo
       run: vrc-get repo add https://vpm.anatawa12.com/vpm.json

     - name: Add bd_ VPM repo
       run: vrc-get repo add https://vpm.nadena.dev/vpm.json

     - name: Install VPM packages
       working-directory: ${{ env.PROJECT_PATH }}
       run: |
        printf '%s\n' "$VPM_PACKAGES" | while IFS= read -r package; do
          if [ -n "${package:-}" ]; then
            echo "installing $package" >&2
            vrc-get install -y "$package"
          fi
        done
       shell: bash
       env:
         VPM_PACKAGES: ${{ join(matrix.vpmPackages, fromJSON('"\n"')) }}

     - name: Resolve VPM packages
       working-directory: ${{ env.PROJECT_PATH }}
       run: vrc-get resolve

     - uses: actions/cache@v4
       with:
         path: ${{ env.PROJECT_PATH }}/Library
         key: Library-${{ runner.os }}-${{ matrix.unityVersion }}-${{ matrix.testMode }}-${{ hashFiles('.ci-unity/Packages/**', '.ci-unity/ProjectSettings/**') }}

     - id: tests
       uses: game-ci/unity-test-runner@v4
       with:
         unityVersion: ${{ matrix.unityVersion }}
         testMode: ${{ matrix.testMode }}
         artifactsPath: ${{ matrix.testMode }}-artifacts
         githubToken: ${{ github.token }}
         checkName: ${{ matrix.testMode }} on ${{ matrix.unityVersion }}${{ matrix.vpmPackages[0] != null && ' with VPM packages ' || '' }}${{ join(matrix.vpmPackages, ', ') }} Test Results
         coverageOptions: 'generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;assemblyFilters:+Meshia.MeshSimplification.*'
         projectPath: ${{ env.PROJECT_PATH }}

     - uses: actions/upload-artifact@v4
       if: always() && steps.tests.outputs.artifactsPath != ''
       with:
         name: Test results for ${{ matrix.testMode }} on ${{ matrix.unityVersion }}${{ matrix.vpmPackages[0] != null && ' with VPM packages ' || '' }}${{ join(matrix.vpmPackages, ', ') }}
         path: ${{ steps.tests.outputs.artifactsPath }}

     - uses: actions/upload-artifact@v4
       if: always() && steps.tests.outputs.coveragePath != ''
       with:
         name: Coverage results for ${{ matrix.testMode }} on ${{ matrix.unityVersion }}${{ matrix.vpmPackages[0] != null && ' with VPM packages ' || '' }}${{ join(matrix.vpmPackages, ', ') }}
         path: ${{ steps.tests.outputs.coveragePath }}
