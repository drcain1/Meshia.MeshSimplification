name: Build Release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: meshia-fork-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public distribution prerequisites
        run: python .github/scripts/vpm.py release-check
      - run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Package fork source
        run: python .github/scripts/vpm.py pack
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("package.json"))["version"])')
          PACKAGE=$(python -c 'import json; print(json.load(open("package.json"))["name"])')
          gh release create "fork-v$VERSION" "dist/$PACKAGE-$VERSION.zip" "dist/$PACKAGE-$VERSION-source.zip" package.json \
            --draft --target "$GITHUB_SHA" --title "Meshia drcain fork $VERSION" \
            --notes-file docs/FORK_DISTRIBUTION.md
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "fork-v$VERSION" --prerelease
          fi
