name: Build Docs

on: 
  workflow_dispatch:
  release:
    types: [published]

env:
  DOCFX_PROJECT_PATH: .docfx

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false
  
jobs:
  publish-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Dotnet Setup
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.x

    - run: dotnet tool update -g docfx
    - run: docfx ${{ env.DOCFX_PROJECT_PATH }}/docfx.json

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build fork VPM listing alongside API docs
      env:
        GH_TOKEN: ${{ github.token }}
      run: python .github/scripts/vpm.py listing --out .docfx/_site/vpm

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        # Upload entire repository
        path: '${{ env.DOCFX_PROJECT_PATH }}/_site'
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4